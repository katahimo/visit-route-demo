name: Cloudflare Workers に公開

# 3つの仕事（ADR-0115）
# ・公開（deploy）：main への push で本番（staff-assign-demo.katahimo.com）へ出す
# ・確認用 URL（preview）：本番を変えずに、その版だけを別の URL（workers.dev のプレビュー URL）に出す。
#   PR に「preview」のラベルを付けたとき（付いた PR への push も）と、手動（ブランチを選んで action=preview）。
#   URL は PR ごと・ブランチごとに固定（同じ PR の push で中身が入れ替わる）。localStorage は URL ごとに分かれるので本番のデータに触らない
# ・戻す（rollback）：手動（action=rollback）。本番を前の版に戻す。版の ID を空にすると直前の版へ。
#   戻したあと main へ push すると、また最新が公開される
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      action:
        description: 'preview＝選んだブランチを確認用 URL に出す／rollback＝本番を前の版に戻す'
        type: choice
        options: [preview, rollback]
        default: preview
      version_id:
        description: '（rollback）戻す先の版の ID。空なら直前の版'
        type: string
        required: false
      reason:
        description: '（rollback）戻す理由'
        type: string
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: 本番へ公開
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # 本番を変えるジョブ（公開・戻す）は同じ組で1つずつ。途中で止めない
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Cloudflare Workers へ公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # 版にコミットを書いておき、戻すときにどの版かわかるようにする
          command: deploy --tag ${{ github.sha }} --message "main ${{ github.sha }}"

  preview:
    name: 確認用 URL に出す
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'preview') ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'preview') &&
           (github.event.action != 'labeled' || github.event.label.name == 'preview')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: URL の名前を決める
        id: alias
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          # PR は pr-<番号>、手動はブランチ名から。英小文字・数字・ハイフンだけ、30文字まで
          if [ -n "$PR_NUMBER" ]; then
            alias="pr-$PR_NUMBER"
          else
            alias=$(printf '%s' "$REF_NAME" | tr 'A-Z' 'a-z' | sed -e 's/[^a-z0-9]\{1,\}/-/g' -e 's/^-*//' | cut -c1-30 | sed -e 's/-*$//')
          fi
          [ -n "$alias" ] || alias=preview
          echo "name=$alias" >> "$GITHUB_OUTPUT"
      - name: 版を上げる（本番には出さない）
        id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: versions upload --preview-alias ${{ steps.alias.outputs.name }} --tag ${{ github.event.pull_request.head.sha || github.sha }} --message "preview ${{ steps.alias.outputs.name }}"
      - name: URL を書き出す
        id: url
        env:
          OUT: ${{ steps.upload.outputs.command-output }}
        run: |
          # 出力のうち、名前で固定の URL（…-visit-route-demo.….workers.dev）を先に、無ければ版ごとの URL を使う
          alias_url=$(printf '%s\n' "$OUT" | grep -i 'alias' | grep -oE 'https://[^ ]+\.workers\.dev' | head -n1)
          version_url=$(printf '%s\n' "$OUT" | grep -oE 'https://[^ ]+\.workers\.dev' | head -n1)
          url=${alias_url:-$version_url}
          version_id=$(printf '%s\n' "$OUT" | grep -oE 'Version ID: [0-9a-f-]+' | head -n1 | cut -d' ' -f3)
          echo "version=$version_id" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -z "$url" ]; then
            # 版は上がったが URL が出ない：preview_urls の入った版がまだ本番に出ていない・workers.dev サブドメインが無いとき。
            # 本番は変わっていないので失敗にせず、知らせだけ出す（ADR-0115）
            echo "::warning::確認用 URL が出力に無い。preview_urls: true の入った版を一度本番に出すと使える（アカウントの workers.dev サブドメインも要る）"
            {
              echo "### 確認用 URL は出なかった"
              echo ""
              echo "版（${version_id:-不明}）は上げたが、本番には出していない。preview_urls: true の入った版を一度本番に出したあとから URL が出る。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### 確認用 URL"
            echo ""
            echo "$url"
            echo ""
            echo "本番とはデータ（ブラウザの localStorage）が別。本番のデータで試すときは、本番で控えを書き出してここで読み込む。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: PR に URL を書く
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.url.outputs.url }}
          VERSION: ${{ steps.url.outputs.version }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const sha = process.env.SHA.slice(0, 7);
            const body = process.env.URL
              ? [
                  marker,
                  `確認用 URL：${process.env.URL}`,
                  '',
                  `版：${sha}。本番とはデータ（ブラウザの localStorage）が別。本番のデータで試すときは、本番で控えを書き出してここで読み込む。`,
                ].join('\n')
              : [
                  marker,
                  `確認用 URL は出なかった（版 ${sha}・Worker の版 ${process.env.VERSION || '不明'} は上げたが本番には出していない）。`,
                  '',
                  '`preview_urls: true` の入った版を一度本番に出したあとから URL が出る（ADR-0115）。',
                ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  rollback:
    name: 本番を前の版に戻す
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: 入力を確かめる
        id: args
        env:
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
        run: |
          # 版の ID は UUID だけ受け付ける（コマンドに入れるため）
          if [ -n "$VERSION_ID" ] && ! printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::版の ID の形が違う（例：0a1b2c3d-…）"
            exit 1
          fi
          echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT"
          # 理由は英数字と一部の記号以外を除いて、コマンドに入れても崩れない形にする
          msg=$(printf '%s' "${REASON:-rollback}" | tr -cd 'A-Za-z0-9 ._:/-' | cut -c1-100)
          echo "message=rollback by ${GITHUB_ACTOR}: ${msg:-rollback}" >> "$GITHUB_OUTPUT"
      - name: 戻す前の版の一覧
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deployments list
      - name: 戻す
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: rollback ${{ steps.args.outputs.version }} --message "${{ steps.args.outputs.message }}" --yes
      - name: 結果を書き出す
        run: |
          {
            echo "### 本番を戻した"
            echo ""
            echo "- 戻した人：${GITHUB_ACTOR}"
            echo "- 版：${{ steps.args.outputs.version || '直前の版' }}"
            echo "- 次に main へ push すると最新が公開される。直すまで main へ入れない"
          } >> "$GITHUB_STEP_SUMMARY"
