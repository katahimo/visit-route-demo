name: e2e（本物のブラウザ）

# 速い検査（lint・型・ユニットテスト・コードの検査・PRD の検査）は PR の push のたびに走らせる。
# e2e（scripts/e2e-*.cjs を @playwright/test で。ADR-0029）は重いので、PR では「e2e」のラベルを付けたときと、付いている PR への push だけ。
# 手動（workflow_dispatch。ブランチを選べる）と夜間（週1回）は全部（ADR-0104）。
# e2e は shard で4つのジョブに分け、速さを見る perf は別のジョブで1本ずつ（PR では走らせない。手動・夜間だけ）。
# ブラウザと依存は Playwright の公式イメージに入っているので、毎回のインストール（約3分）をしない。
# 公開（deploy.yml）はまだこれを待たない
#
# 非公開リポジトリの無料枠（Actions 月2000分）に収めるため、
# ・文書だけの変更（docs/・*.md）では PR で走らせない
# ・夜間は毎週月曜に1回だけ（約700分/月 → 約100分/月）
on:
  pull_request:
    # labeled：「e2e」のラベルを付けたときに e2e を走らせる
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  schedule:
    # 毎週月曜 03:00（日本時間）
    - cron: '0 18 * * 0'

permissions:
  contents: read

concurrency:
  # ラベルを付けたときの実行（e2e）と push の実行（速い検査）は別の組にし、互いに止めない
  group: e2e-${{ github.event_name }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'run' }}
  cancel-in-progress: true

env:
  # ビルドと配信は各ジョブで1回だけ。設定ファイルの webServer は使わない。
  # コンテナの中の localhost は ::1 になり vite preview の待ち受け（IPv4）と合わないので 127.0.0.1 に固定
  BASE: http://127.0.0.1:4183/

jobs:
  check:
    name: 速い検査
    # ラベルを付けただけ（コードは同じ）のときは走らせない
    if: ${{ github.event.action != 'labeled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 競合の印（<<<<<<<・>>>>>>>）の検査も npm run lint に入っている（PRD D253）
      - run: npm run lint
      - run: npm run typecheck
      # 設計の決まり（層の依存・循環 import・長い関数・使われない export）の違反を基準より増やさない（AGENTS.md）
      - run: npm run check:code
      # PRD の索引・D番号・廃止の行がテーマ別ファイルとそろっているか（AGENTS.md「規約」）
      - run: npm run check:prd
      - run: npm test

  e2e:
    # PR では「e2e」のラベルがあるときだけ（付けたとき・付いた PR への push）。ほかのラベルを付けたときは走らせない
    if: >-
      ${{ github.event_name != 'pull_request' ||
          (github.event.action == 'labeled' && github.event.label.name == 'e2e') ||
          (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'e2e')) }}
    # Playwright の版（package.json の @playwright/test）と同じイメージを使う。版を上げるときはここも上げる
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        # 夜間だけ月末の「今日」でも走らせる（空は次の水曜の日本時間 12:00）
        fake_now: ${{ github.event_name == 'schedule' && fromJSON('["", "2026-10-28T12:00:00+09:00", "2026-12-30T12:00:00+09:00"]') || fromJSON('[""]') }}
    name: e2e ${{ matrix.shard }}/4 ${{ matrix.fake_now || '次の水曜' }}
    env:
      FAKE_NOW: ${{ matrix.fake_now }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 配信を始めて待つ
        run: |
          npx vite preview --host 127.0.0.1 --port 4183 --strictPort > preview.log 2>&1 &
          node -e "(async()=>{for(let i=0;i<60;i++){try{if((await fetch(process.env.BASE)).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()" || { cat preview.log; exit 1; }
      - run: npx playwright test --project=e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        # 保存の容量の上限などで残せなくても、テストの結果（前の段）でジョブの成否を決める
        continue-on-error: true
        # 報告は落ちたときだけ残す（保存の容量を使い切らない。ADR-0104）
        if: ${{ failure() }}
        with:
          name: playwright-report-e2e-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 3
      # test-results（落ちた test の trace.zip・動画・スクリーンショット・記録）は失敗のときに残す（ADR-0041）
      - uses: actions/upload-artifact@v4
        # 保存の容量の上限などで残せなくても、テストの結果（前の段）でジョブの成否を決める
        continue-on-error: true
        if: ${{ failure() }}
        with:
          name: test-results-e2e-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3

  perf:
    # 速さの上限を見るもの（e2e/legacy.spec.ts の PERF）。ほかと同時に走らせると遅れるので、別のジョブで1本ずつ。
    # 共有ランナーの速さはぶれるので PR では走らせず、手動・夜間だけ
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fake_now: ${{ github.event_name == 'schedule' && fromJSON('["", "2026-10-28T12:00:00+09:00", "2026-12-30T12:00:00+09:00"]') || fromJSON('[""]') }}
    name: perf ${{ matrix.fake_now || '次の水曜' }}
    env:
      FAKE_NOW: ${{ matrix.fake_now }}
      # 速さの上限：手元は既定（100/3000/5000ms）、CI は共有ランナーのため緩める
      PERF_MS_COMPAT: 300
      PERF_MS_NAV: 300
      PERF_MS_DETAILS: 300
      PERF_MS_PROGRESS: 6000
      PERF_MS_VACANCY: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 配信を始めて待つ
        run: |
          npx vite preview --host 127.0.0.1 --port 4183 --strictPort > preview.log 2>&1 &
          node -e "(async()=>{for(let i=0;i<60;i++){try{if((await fetch(process.env.BASE)).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()" || { cat preview.log; exit 1; }
      - run: npm run e2e:perf
      - uses: actions/upload-artifact@v4
        # 保存の容量の上限などで残せなくても、テストの結果（前の段）でジョブの成否を決める
        continue-on-error: true
        # 報告は落ちたときだけ残す（保存の容量を使い切らない。ADR-0104）
        if: ${{ failure() }}
        with:
          name: playwright-report-perf-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        # 保存の容量の上限などで残せなくても、テストの結果（前の段）でジョブの成否を決める
        continue-on-error: true
        if: ${{ failure() }}
        with:
          name: test-results-perf-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3
